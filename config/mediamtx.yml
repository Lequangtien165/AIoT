# RTSP relay for the local publisher, reachable by trusted LAN clients.
logLevel: info
logDestinations: [stdout]

rtsp: true
rtspAddress: 0.0.0.0:8554
rtspTransports: [tcp]

rtmp: false
hls: false
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [100.89.159.16]
srt: false
moq: false

paths:
  camera:
    source: publisher
